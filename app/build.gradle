plugins {
    id 'com.android.application'
}

// Release signing comes from the environment (CI secrets) so no key or
// password lives in the repo. Without it, release builds use the debug key.
def keystorePath = System.getenv('WASMCART_KEYSTORE_FILE')
def releaseKeystore = keystorePath && file(keystorePath).exists() ? file(keystorePath) : null

android {
    namespace 'dev.wasmcart.androidplayer'
    compileSdk 36
    ndkVersion '27.2.12479018'

    defaultConfig {
        applicationId 'dev.wasmcart.androidplayer'
        minSdk 33          // V8/libnode floor: Bionic backtrace symbols
        targetSdk 36
        versionCode((System.getenv('WASMCART_VERSION_CODE') ?: '1').toInteger())
        versionName(System.getenv('WASMCART_VERSION_NAME') ?: '0.1.0')

        ndk {
            abiFilters 'arm64-v8a'
        }
        externalNativeBuild {
            cmake {
                arguments '-DANDROID_PLATFORM=android-33'
                // SDL2 is EXCLUDE_FROM_ALL in CMake; name it so AGP builds
                // and packages it alongside libmain.so
                targets 'main', 'SDL2'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path '../native/CMakeLists.txt'
            version '3.22.1'
        }
    }

    sourceSets {
        main {
            // SDLActivity + friends come from the fetched SDL source tree,
            // not a vendored copy: one SDL version for Java and C.
            java.srcDirs += '../deps/SDL/android-project/app/src/main/java'
        }
    }

    signingConfigs {
        if (releaseKeystore != null) {
            release {
                storeFile releaseKeystore
                storePassword System.getenv('WASMCART_KEYSTORE_PASSWORD')
                keyAlias System.getenv('WASMCART_KEY_ALIAS')
                keyPassword System.getenv('WASMCART_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig releaseKeystore != null ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
